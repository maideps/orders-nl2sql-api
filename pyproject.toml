[project]
name = "orders-nl2sql-api"
version = "0.1.0"
description = "Orders data: cleaning, SQL views and an API that answers natural-language questions"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
